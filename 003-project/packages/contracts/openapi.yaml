# Arquivo GERADO por packages/contracts/scripts/generate-openapi.mjs — não edite à mão.
openapi: 3.1.0
info:
  title: Bolha Venda API
  version: 1.0.0
  description: "Contrato REST gerado de @bolha/contracts (Zod) — NÃO EDITE À MÃO: rode `npm run openapi --workspace @bolha/contracts`. Fonte normativa: 002-llm/002 Docs/05-arquitetura/api-rest.md."
servers:
  - url: https://api.bolhavenda.com.br/api/v1
    description: Produção
  - url: https://api.staging.bolhavenda.com.br/api/v1
    description: Staging
tags:
  - name: identity
    description: Identidade e LGPD (F1)
  - name: bubbles
    description: Bolhas e canvas (F2–F4)
  - name: quotas
    description: Cotas (F5, F6)
  - name: payments
    description: Pagamentos e repasses (F5)
  - name: bids
    description: Lances C2B (F8)
  - name: notifications
    description: Notificações (F11)
  - name: webhooks
    description: Webhooks de provedores
paths:
  /auth/register:
    post:
      operationId: register
      tags:
        - identity
      summary: Cadastro PF ou PJ — resposta sempre genérica (anti-enumeração)
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Sempre a mesma resposta, exista ou não conta com o e-mail/documento (SEC-08/SEC-22).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterAcceptedResponse"
        "422":
          description: "Erro (problem+json). Códigos: VALIDATION_FAILED, CPF_INVALID, CNPJ_INVALID, CNPJ_NOT_ACTIVE, CONSENT_REQUIRED"
          x-error-codes:
            - VALIDATION_FAILED
            - CPF_INVALID
            - CNPJ_INVALID
            - CNPJ_NOT_ACTIVE
            - CONSENT_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "428":
          description: "Erro (problem+json). Códigos: CAPTCHA_REQUIRED"
          x-error-codes:
            - CAPTCHA_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/email/confirm:
    post:
      operationId: confirmEmail
      tags:
        - identity
      summary: Confirmar e-mail e entrar
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 512
              required:
                - token
              additionalProperties: false
      responses:
        "201":
          description: Sessão criada (+ cookie __Host-bv_rt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: "Erro (problem+json). Códigos: TOKEN_EXPIRED"
          x-error-codes:
            - TOKEN_EXPIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: "Erro (problem+json). Códigos: VALIDATION_FAILED"
          x-error-codes:
            - VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/email/resend:
    post:
      operationId: resendConfirmationEmail
      tags:
        - identity
      summary: Reenviar e-mail de confirmação — resposta sempre genérica
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - email
              additionalProperties: false
      responses:
        "202":
          description: Sempre a mesma resposta (anti-enumeração).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericAcceptedResponse"
        "422":
          description: "Erro (problem+json). Códigos: VALIDATION_FAILED"
          x-error-codes:
            - VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/login:
    post:
      operationId: login
      tags:
        - identity
      summary: Login com e-mail e senha
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
                captcha_token:
                  anyOf:
                    - type: string
                      maxLength: 4096
                    - type: "null"
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Sessão criada (+ cookie de refresh)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: "Erro (problem+json). Códigos: INVALID_CREDENTIALS"
          x-error-codes:
            - INVALID_CREDENTIALS
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Erro (problem+json). Códigos: ACCOUNT_SUSPENDED"
          x-error-codes:
            - ACCOUNT_SUSPENDED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: "Erro (problem+json). Códigos: VALIDATION_FAILED"
          x-error-codes:
            - VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "428":
          description: "Erro (problem+json). Códigos: CAPTCHA_REQUIRED"
          x-error-codes:
            - CAPTCHA_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - identity
      summary: Renovar access token (rotação do refresh)
      x-auth: refresh-cookie
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: "Erro (problem+json). Códigos: UNAUTHENTICATED, REFRESH_TOKEN_REUSED"
          x-error-codes:
            - UNAUTHENTICATED
            - REFRESH_TOKEN_REUSED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/logout:
    post:
      operationId: logout
      tags:
        - identity
      summary: Encerrar sessão (revoga a família do refresh)
      x-auth: refresh-cookie
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Sem conteúdo
        "401":
          description: "Erro (problem+json). Códigos: UNAUTHENTICATED"
          x-error-codes:
            - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags:
        - identity
      summary: Recuperação de senha — resposta sempre genérica
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - email
              additionalProperties: false
      responses:
        "202":
          description: Sempre a mesma resposta (anti-enumeração).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericAcceptedResponse"
        "422":
          description: "Erro (problem+json). Códigos: VALIDATION_FAILED"
          x-error-codes:
            - VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "428":
          description: "Erro (problem+json). Códigos: CAPTCHA_REQUIRED"
          x-error-codes:
            - CAPTCHA_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags:
        - identity
      summary: Redefinir senha (revoga todas as sessões)
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 16
                  maxLength: 512
                password:
                  type: string
                  minLength: 15
                  maxLength: 128
              required:
                - token
                - password
              additionalProperties: false
      responses:
        "204":
          description: Sem conteúdo
        "401":
          description: "Erro (problem+json). Códigos: TOKEN_EXPIRED"
          x-error-codes:
            - TOKEN_EXPIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: "Erro (problem+json). Códigos: VALIDATION_FAILED"
          x-error-codes:
            - VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /me:
    get:
      operationId: getMe
      tags:
        - identity
      summary: Meus dados (mascarados)
      x-auth: authenticated
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dados do titular (+ ETag)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: "Erro (problem+json). Códigos: UNAUTHENTICATED, TOKEN_EXPIRED"
          x-error-codes:
            - UNAUTHENTICATED
            - TOKEN_EXPIRED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      operationId: updateMe
      tags:
        - identity
      summary: Atualizar meus dados
      x-auth: authenticated
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 120
                phone:
                  type: string
                  pattern: ^\+?\d{10,14}$
                shipping_address:
                  $ref: "#/components/schemas/ShippingAddress"
                nickname:
                  type: string
                  pattern: ^[\p{L}\p{N}_.-]{3,24}$
                preferences:
                  type: object
                  properties:
                    reduce_motion:
                      type: boolean
                  required:
                    - reduce_motion
                  additionalProperties: false
                cpf:
                  type: string
                  pattern: ^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$
                cnpj:
                  type: string
                  pattern: ^\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}$
              additionalProperties: false
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: "Erro (problem+json). Códigos: UNAUTHENTICATED"
          x-error-codes:
            - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Erro (problem+json). Códigos: ACCOUNT_SUSPENDED"
          x-error-codes:
            - ACCOUNT_SUSPENDED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: "Erro (problem+json). Códigos: NICKNAME_UNAVAILABLE, DOCUMENT_ALREADY_REGISTERED"
          x-error-codes:
            - NICKNAME_UNAVAILABLE
            - DOCUMENT_ALREADY_REGISTERED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "412":
          description: "Erro (problem+json). Códigos: VERSION_CONFLICT"
          x-error-codes:
            - VERSION_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: "Erro (problem+json). Códigos: VALIDATION_FAILED, CPF_INVALID, CNPJ_INVALID, CNPJ_NOT_ACTIVE"
          x-error-codes:
            - VALIDATION_FAILED
            - CPF_INVALID
            - CNPJ_INVALID
            - CNPJ_NOT_ACTIVE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /me/company/verification:
    post:
      operationId: requestCompanyVerification
      tags:
        - identity
      summary: Revalidar CNPJ agora
      x-auth: pj
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_status:
                    type: string
                    const: PENDING_VERIFICATION
                  check_id:
                    $ref: "#/components/schemas/Uuid"
                required:
                  - verification_status
                  - check_id
                additionalProperties: false
        "401":
          description: "Erro (problem+json). Códigos: UNAUTHENTICATED"
          x-error-codes:
            - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Erro (problem+json). Códigos: ACCOUNT_SUSPENDED, FORBIDDEN"
          x-error-codes:
            - ACCOUNT_SUSPENDED
            - FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /me/payout-recipient:
    post:
      operationId: registerPayoutRecipient
      tags:
        - identity
      summary: Cadastro de recebedor (vendedor)
      x-auth: authenticated
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_account:
                  type: object
                  properties:
                    bank:
                      type: string
                      pattern: ^\d{3}$
                    branch:
                      type: string
                      pattern: ^\d{1,5}(-?\d)?$
                    account:
                      type: string
                      pattern: ^\d{1,13}-?[\dXx]?$
                    type:
                      type: string
                      enum:
                        - CHECKING
                        - SAVINGS
                  required:
                    - bank
                    - branch
                    - account
                    - type
                  additionalProperties: false
                holder_document:
                  anyOf:
                    - type: string
                      pattern: ^\d{3}\.?\d{3}\.?\d{3}-?\d{2}$
                    - type: string
                      pattern: ^\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}$
              required:
                - bank_account
                - holder_document
              additionalProperties: false
      responses:
        "202":
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - NOT_REGISTERED
                      - PENDING_REVIEW
                      - APPROVED
                      - REJECTED
                required:
                  - status
                additionalProperties: false
        "401":
          description: "Erro (problem+json). Códigos: UNAUTHENTICATED"
          x-error-codes:
            - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "403":
          description: "Erro (problem+json). Códigos: ACCOUNT_SUSPENDED"
          x-error-codes:
            - ACCOUNT_SUSPENDED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: "Erro (problem+json). Códigos: VALIDATION_FAILED"
          x-error-codes:
            - VALIDATION_FAILED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "429":
          description: "Erro (problem+json). Códigos: RATE_LIMITED"
          x-error-codes:
            - RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    get:
      operationId: getPayoutRecipient
      tags:
        - identity
      summary: Status do recebedor
      x-auth: authenticated
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - NOT_REGISTERED
                      - PENDING_REVIEW
                      - APPROVED
                      - REJECTED
                required:
                  - status
                additionalProperties: false
        "401":
          description: "Erro (problem+json). Códigos: UNAUTHENTICATED"
          x-error-codes:
            - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          description: Erro não previsto (INTERNAL_ERROR) ou de plataforma (SERVICE_UNAVAILABLE)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /me/consents:
    get:
      operationId: listConsents
      tags:
        - identity
      summary: Histórico versionado de consentimentos
      x-auth: authenticated
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    purpose:
                      type: string
                      enum:
                        - terms
                        - privacy
                        - marketing
                    version:
                      type:
                        - string
                        - "null"
                    granted:
                      type: boolean
                    at:
                      $ref: "#/components/schemas/IsoDateTime"
                    channel:
                      type: string
                  required:
                    - purpose
                    - version
                    - granted
                    - at
                    - channel
                  additionalProperties: false
        "401":
          description: "Erro (problem+json). Códigos: UNAUTHENTICATED"
          x-error-codes:
            - UNAUTHENTICATED
          content:
            application/problem+json:
              schema:
