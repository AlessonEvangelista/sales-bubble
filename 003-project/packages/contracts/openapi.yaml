      type: object
      properties:
        unit_price:
          minimum: 1
          $ref: "#/components/schemas/Cents"
        delivery_days:
          type: integer
          minimum: 1
          maximum: 365
        conditions:
          type: string
          maxLength: 1000
      required:
        - unit_price
        - delivery_days
      additionalProperties: false
