components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-bv_rt
  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID por intenção do usuário (api-rest §1.3).
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Recomendado (api-rest §1.3).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag "v{version}" (concorrência otimista).
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit do cookie bv_csrf.
      schema:
        type: string
  schemas:
    AccountStatus:
      type: string
      enum:
        - PENDING_EMAIL_CONFIRMATION
        - INCOMPLETE
        - ACTIVE
        - SUSPENDED
    AccountSummary:
      type: object
      properties:
        account_type:
          $ref: "#/components/schemas/AccountType"
        pseudonym:
          $ref: "#/components/schemas/Pseudonym"
        status:
          $ref: "#/components/schemas/AccountStatus"
        company:
          anyOf:
            - $ref: "#/components/schemas/CompanyInfo"
            - type: "null"
      required:
        - id
        - account_type
        - pseudonym
      additionalProperties: false
    AccountType:
      type: string
      enum:
        - PF
        - PJ
    AcquireQuotaRequest:
      type: object
      properties:
        quantity:
          default: 1
          type: integer
          minimum: 1
          maximum: 10000
        payment:
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: CARD
                card_token:
                  type: string
                  minLength: 1
                  maxLength: 512
                installments:
                  default: 1
                  type: integer
                  minimum: 1
                  maximum: 12
              required:
                - method
                - card_token
              additionalProperties: false
            - type: object
              properties:
                method:
                  type: string
                  const: PIX
              required:
                - method
              additionalProperties: false
      required:
        - payment
      additionalProperties: false
    AcquireQuotaResponse:
      type: object
      properties:
        quota:
          $ref: "#/components/schemas/QuotaView"
        payment:
          $ref: "#/components/schemas/PaymentSummary"
        bubble:
          $ref: "#/components/schemas/BubbleStatePatch"
        pix:
          type: object
          properties:
            qr_code:
              type: string
            qr_code_image_url:
              type: string
              format: uri
            expires_at:
              $ref: "#/components/schemas/IsoDateTime"
          required:
            - qr_code
            - qr_code_image_url
            - expires_at
          additionalProperties: false
      required:
        - quota
        - payment
        - bubble
      additionalProperties: false
    BidListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BidView"
        summary:
          type: object
          properties:
            bids_count:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            best_price:
              anyOf:
                - $ref: "#/components/schemas/Cents"
                - type: "null"
            target_price:
              $ref: "#/components/schemas/Cents"
          required:
            - bids_count
            - best_price
            - target_price
          additionalProperties: false
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - summary
        - page
      additionalProperties: false
    BidStatus:
      type: string
      enum:
        - ACTIVE
        - WITHDRAWN
        - SELECTED
        - NOT_SELECTED
    BidView:
      type: object
      properties:
        bidder:
          type: object
          properties:
            pseudonym:
              type: string
            score_band:
              $ref: "#/components/schemas/ScoreBand"
            score:
              type: integer
              minimum: 0
              maximum: 1000
          required:
            - pseudonym
            - score_band
          additionalProperties: false
        unit_price:
          $ref: "#/components/schemas/Cents"
        delivery_days:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        conditions:
          type: string
          maxLength: 1000
        status:
          $ref: "#/components/schemas/BidStatus"
        submitted_at:
          $ref: "#/components/schemas/IsoDateTime"
        valid_until:
          $ref: "#/components/schemas/IsoDateTime"
        is_mine:
          type: boolean
      required:
        - id
        - bidder
        - unit_price
        - delivery_days
        - status
        - submitted_at
      additionalProperties: false
    BubbleAction:
      type: string
      enum:
        - JOIN_QUOTA
        - LEAVE_QUOTA
        - SUBMIT_BID
        - WITHDRAW_BID
        - SELECT_BID
        - PUBLISH
        - EDIT
        - EDIT_CONTENT
        - CANCEL
        - REPORT
    BubbleDetail:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/BubbleType"
        status:
          $ref: "#/components/schemas/BubbleStatus"
        title:
          type: string
        category:
          $ref: "#/components/schemas/CategoryRef"
        image_url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        creator:
          $ref: "#/components/schemas/PublicCreator"
        currency:
          $ref: "#/components/schemas/Currency"
        initial_price:
          anyOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
        target_price:
          anyOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
        current_price:
          anyOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
        next_tier:
          anyOf:
            - $ref: "#/components/schemas/NextTier"
            - type: "null"
        min_quotas:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        max_quotas:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        filled_quotas:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        reserved_quotas:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        available_quotas:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        is_near_full:
          type: boolean
        is_expiring:
          type: boolean
        starts_at:
          anyOf:
            - $ref: "#/components/schemas/IsoDateTime"
            - type: "null"
        expires_at:
          anyOf:
            - $ref: "#/components/schemas/IsoDateTime"
            - type: "null"
        exploded_at:
          anyOf:
            - $ref: "#/components/schemas/IsoDateTime"
            - type: "null"
        canvas_x:
          type: number
        canvas_y:
          type: number
        radius:
          type: number
          exclusiveMinimum: 0
        version:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        description:
          type:
            - string
            - "null"
        images:
          maxItems: 5
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              alt:
                type:
                  - string
                  - "null"
            required:
              - url
            additionalProperties: false
        price_tiers:
          type: array
          items:
            type: object
            properties:
              min_filled_quotas:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              unit_price:
                $ref: "#/components/schemas/Cents"
              reached:
                type: boolean
            required:
              - min_filled_quotas
              - unit_price
              - reached
            additionalProperties: false
        max_pj_share:
          type: number
          minimum: 0.1
          maximum: 1
        shipping_days:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        outcome:
          anyOf:
            - $ref: "#/components/schemas/ExplosionOutcome"
            - type: "null"
        explosion_reason:
          anyOf:
            - $ref: "#/components/schemas/ExplosionReason"
            - type: "null"
        final_price:
          anyOf:
            - $ref: "#/components/schemas/Cents"
            - type: "null"
        selected_bid_id:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        winner:
          anyOf:
            - type: object
              properties:
                pseudonym:
                  type: string
                legal_name:
                  type: string
              required:
                - pseudonym
              additionalProperties: false
            - type: "null"
        bids_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        bid_selection_deadline:
          anyOf:
            - $ref: "#/components/schemas/IsoDateTime"
            - type: "null"
        participants_preview:
          type: array
          items:
            type: string
        my_participation:
          anyOf:
            - $ref: "#/components/schemas/MyParticipation"
            - type: "null"
        allowed_actions:
          type: array
          items:
            $ref: "#/components/schemas/BubbleAction"
        blocked_actions:
          type: array
          items:
            type: object
            properties:
              action:
                $ref: "#/components/schemas/BubbleAction"
              code:
                type: string
            required:
              - action
              - code
            additionalProperties: false
        server_time:
          $ref: "#/components/schemas/IsoDateTime"
      required:
        - id
        - type
        - status
        - max_quotas
        - filled_quotas
        - reserved_quotas
        - is_near_full
        - is_expiring
        - canvas_x
        - canvas_y
        - radius
        - version
      additionalProperties: false
    BubblePage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BubbleSummary"
        page:
          $ref: "#/components/schemas/PageInfo"
      required:
        - data
        - page
      additionalProperties: false
    BubbleStatePatch:
      type: object
      properties:
        filled_quotas:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        reserved_quotas:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        available_quotas:
          type: integer
          minimum: 0
          maximum: 9007199254740991
